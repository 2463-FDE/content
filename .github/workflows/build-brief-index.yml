# Rebuilds brief-pipeline/data/index.json whenever a weekly AI Market Brief file
# lands in brief-pipeline/data/briefs/. Free: GitHub-hosted runner, no secrets.
#
# This workflow only touches brief-pipeline/data/index.json. It does not build
# or deploy the site: GitHub Pages keeps serving main as-is, and the bot commit
# below is picked up by the normal Pages build like any other push.
name: Build brief index

on:
  push:
    branches: [main]
    paths:
      - "brief-pipeline/data/briefs/**.json"
      - "brief-pipeline/scripts/**.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-brief-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build index
        run: python3 brief-pipeline/scripts/build_index.py
      - name: Smoke test a query
        run: python3 brief-pipeline/scripts/query.py "compliance deadline" --k 1
      - name: Commit index if it changed
        run: |
          if ! git diff --quiet -- brief-pipeline/data/index.json; then
            git config user.name "brief-index-bot"
            git config user.email "brief-index-bot@users.noreply.github.com"
            git add brief-pipeline/data/index.json
            git commit -m "Rebuild brief index"
            git push
          fi
