<style>
  /* ---- trainer page (reuses site design language) ---- */
  .tr-wrap { max-width: 760px; margin: 0 auto; padding: 0 24px 70px; }
  .tr-hero { padding: 40px 0 18px; }
  .tr-hero h1 { font-size: 38px; margin: 0 0 8px; letter-spacing: -.5px; }
  .tr-hero h1 b { color: var(--accent); }
  .tr-hero p { color: var(--ink-soft); font-size: 17px; max-width: 620px; margin: 0; }

  .tr-card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:24px 26px; box-shadow:0 6px 24px var(--shadow); margin:18px 0; }
  .tr-card h2 { font-size:18px; margin:0 0 16px; }

  .tr-form { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .tr-field { display:flex; flex-direction:column; gap:5px; }
  .tr-field label { font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:var(--ink-soft); }
  .tr-field input, .tr-field select { font:inherit; font-size:15px; padding:9px 11px; border:1.5px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); min-width:200px; }
  .tr-field input:focus, .tr-field select:focus { outline:none; border-color:var(--accent); }

  .tr-result { display:none; margin-top:16px; border:1px solid var(--accent-line); background:var(--accent-soft); border-radius:12px; padding:14px 16px; }
  .tr-result .lbl { font-size:12px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:var(--accent-ink); }
  .tr-result .code { font-family:var(--mono); font-size:21px; font-weight:700; color:var(--ink); margin:6px 0 4px; user-select:all; }
  .tr-result .hint { font-size:13px; color:var(--ink-soft); margin:0; }
  .tr-result .copy { margin-top:8px; }

  .tr-err { color:var(--bad-ink); font-size:14px; margin-top:10px; min-height:1em; }
  .tr-msg { color:var(--ink-soft); font-size:14px; }

  table.tr-list { width:100%; border-collapse:collapse; font-size:14.5px; }
  table.tr-list th, table.tr-list td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); }
  table.tr-list th { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); }
  table.tr-list td.who { font-weight:650; }
  .tr-pill { display:inline-block; font-size:11px; font-weight:700; border-radius:20px; padding:2px 9px; }
  .tr-pill.role { background:var(--info-soft); color:var(--info); }
  .tr-pill.builtin { background:var(--code-bg); color:var(--ink-soft); }
  .tr-reset { font:inherit; font-size:13px; cursor:pointer; border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent); border-radius:8px; padding:5px 11px; margin-right:6px; }
  .tr-reset:hover { filter:brightness(.97); }
  .tr-revoke { font:inherit; font-size:13px; cursor:pointer; border:1px solid var(--bad-line); background:var(--bad-soft); color:var(--bad-ink); border-radius:8px; padding:5px 11px; }
  .tr-revoke:hover { background:var(--bad-soft); }
  .tr-revoke[disabled] { opacity:.4; cursor:not-allowed; }
  .tr-tabs { display:flex; gap:4px; margin:0 0 20px; border-bottom:1px solid var(--line); }
  .tr-tab { font:inherit; font-size:15px; font-weight:600; cursor:pointer; border:none; background:none; color:var(--ink-soft); padding:10px 16px; border-bottom:3px solid transparent; margin-bottom:-1px; }
  .tr-tab:hover { color:var(--ink); }
  .tr-tab.on { color:var(--accent); border-bottom-color:var(--accent); }
  .tr-tabpanel[hidden] { display:none; }
  .tr-sub { font-size:13.5px; color:var(--ink-soft); margin:-4px 0 12px; }

  .tr-denied { max-width:520px; margin:80px auto; text-align:center; }
  .tr-denied h2 { font-size:24px; margin:0 0 8px; }
  .tr-denied p { color:var(--ink-soft); font-size:16px; }

  /* ---- reports: overview table + per-learner viewer ---- */
  .tr-wide { max-width:1000px; }
  table.tr-ov { width:100%; border-collapse:collapse; font-size:14px; }
  table.tr-ov th, table.tr-ov td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.tr-ov th { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); white-space:nowrap; }
  table.tr-ov td.who { font-weight:650; white-space:nowrap; }
  table.tr-ov td.num { font-variant-numeric:tabular-nums; }
  .ov-weak { color:var(--ink-soft); font-size:13px; }
  .ov-na { color:var(--dim); }
  .tr-pill.mastered { background:var(--good-soft); color:var(--good-ink); }
  .tr-pill.notmastered { background:var(--warn-soft); color:#e8590c; }
  .rep-pick { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:8px; }
  .rep-body { margin-top:16px; }
  .rep-meta { font-size:12px; color:var(--ink-soft); margin:0 0 12px; }
  .rep-sec { margin:0 0 14px; }
  .rep-sec h3 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin:0 0 5px; }
  .rep-sec p { margin:0; font-size:15px; line-height:1.5; }
  .rep-sec ul { margin:4px 0 0; padding-left:20px; font-size:15px; line-height:1.5; }
  .rep-empty { color:var(--ink-soft); font-size:14px; }
  .btn.secondary { border-color:var(--line); background:var(--surface); color:var(--ink); }
</style>

<script src="assets/js/roster.js?v=20260706"></script>
<script src="assets/js/auth.js"></script>
<script>
/* Trainer-only login management. auth.js gates the page (shows the access-code
   overlay if logged out); this script then checks the resolved role. Only a
   "trainer" session can add/list/revoke logins — the Worker also enforces this
   server-side (a forged role here still fails without a valid trainer token). */
(function () {
  const RUN = (window.FDE_RUN_URL || "").replace(/\/$/, "");
  const app = document.getElementById("tr-app");

  function identity() { try { return JSON.parse(localStorage.getItem("fde_identity") || "null"); } catch (e) { return null; } }
  function token() { return localStorage.getItem("fde_session") || ""; }
  function authHeaders() { return { "content-type": "application/json", "Authorization": "Bearer " + token() }; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c])); }

  // ---- cohort state (shared across the reports + logins panels) ----
  let COHORTS = [];      // [{slug,label,createdAt}] — registered cohorts
  let OV_LEARNERS = [];  // last-loaded overview rows (each carries a bucketed .cohort)

  // Build <option>s for a cohort <select>. opts: {all} adds "All cohorts" (value
  // __all), {uat} adds a UAT option, {none} adds an empty "none (UAT)" option.
  function cohortOptions(selected, opts) {
    opts = opts || {};
    let h = "";
    if (opts.all) h += '<option value="__all"' + (selected === "__all" ? " selected" : "") + ">All cohorts</option>";
    if (opts.none) h += '<option value=""' + (!selected ? " selected" : "") + ">— none (UAT) —</option>";
    h += COHORTS.map(c => '<option value="' + esc(c.slug) + '"' + (c.slug === selected ? " selected" : "") + ">" + esc(c.label || c.slug) + "</option>").join("");
    if (opts.uat) h += '<option value="UAT"' + (selected === "UAT" ? " selected" : "") + ">UAT (unassigned)</option>";
    return h;
  }
  // A stored login cohort is only "selected" if it's still a registered cohort.
  function knownCohort(slug) { return COHORTS.some(c => c.slug === slug) ? slug : ""; }

  function renderDenied() {
    app.innerHTML =
      '<div class="tr-wrap"><div class="tr-denied">' +
        '<h2>Trainers only</h2>' +
        '<p>This page is for trainers. If you think you should have access, check with your lead for a trainer code.</p>' +
      '</div></div>';
  }

  function renderApp() {
    app.innerHTML =
      '<div class="tr-wrap tr-wide">' +
        '<div class="tr-hero">' +
          '<h1>Trainer · <b>Dashboard</b></h1>' +
          '<p>Cohort progress and weekly reports, plus login management — all in one place.</p>' +
        '</div>' +
        '<div class="tr-tabs" role="tablist">' +
          '<button class="tr-tab on" data-tab="reports" type="button">📊 Reports</button>' +
          '<button class="tr-tab" data-tab="logins" type="button">🔑 Logins</button>' +
        '</div>' +
        // ----- Reports panel -----
        '<div class="tr-tabpanel" data-panel="reports">' +
          '<div class="tr-card">' +
            '<h2 style="display:flex;justify-content:space-between;align-items:center;gap:10px">Cohort overview ' +
              '<button class="btn secondary" id="ov-refresh" type="button" style="font-size:13px;padding:6px 12px">Refresh</button></h2>' +
            '<div class="rep-pick" style="margin-bottom:12px">' +
              '<div class="tr-field"><label for="ov-cohort">Show cohort</label><select id="ov-cohort"></select></div>' +
              '<span class="tr-msg" id="ov-count"></span>' +
            '</div>' +
            '<div id="ov-msg" class="tr-msg">Loading…</div>' +
            '<div style="overflow-x:auto">' +
              '<table class="tr-ov" id="ov-tbl" style="display:none"><thead><tr>' +
                '<th>Name</th><th>Cohort</th><th>Role</th><th>Days done</th><th>Interview best</th><th>Weekly</th><th>Collab best</th><th>SD best</th><th>Mastery</th><th>Top weak concepts</th>' +
              '</tr></thead><tbody id="ov-body"></tbody></table>' +
            '</div>' +
          '</div>' +
          '<div class="tr-card">' +
            '<h2>Weekly report</h2>' +
            '<div class="rep-pick">' +
              '<div class="tr-field"><label for="rep-name">Learner</label>' +
                '<select id="rep-name"><option value="">Select a learner…</option></select></div>' +
              '<button class="btn secondary" id="rep-view" type="button">View latest</button>' +
              '<button class="btn" id="rep-gen" type="button">Generate now</button>' +
            '</div>' +
            '<div class="tr-err" id="rep-err"></div>' +
            '<div class="rep-body" id="rep-body"><p class="rep-empty">Pick a learner and view their latest weekly report, or generate one on demand.</p></div>' +
          '</div>' +
        '</div>' +
        // ----- Logins panel -----
        '<div class="tr-tabpanel" data-panel="logins" hidden>' +
          '<div class="tr-card">' +
            '<h2>Cohorts</h2>' +
            '<p class="tr-sub">Add a cohort number first, then assign learners to it — when you generate a code or afterwards. Anyone not assigned to a registered cohort (and non-trainers) is treated as a <b>UAT</b> account.</p>' +
            '<div class="tr-form">' +
              '<div class="tr-field"><label for="c-num">Cohort number</label><input id="c-num" type="text" placeholder="e.g. 2463" autocomplete="off" spellcheck="false"></div>' +
              '<button class="btn" id="c-go" type="button">Add cohort</button>' +
            '</div>' +
            '<div class="tr-err" id="c-err"></div>' +
            '<div id="c-list" class="tr-msg" style="margin-top:14px">Loading…</div>' +
          '</div>' +
          '<div class="tr-card">' +
            '<h2>Add a login</h2>' +
            '<div class="tr-form">' +
              '<div class="tr-field"><label for="f-name">Name</label><input id="f-name" type="text" placeholder="Full name" autocomplete="off" spellcheck="false"></div>' +
              '<div class="tr-field"><label for="f-role">Role</label>' +
                '<select id="f-role"><option value="learner">learner</option><option value="trainer">trainer</option><option value="practice">practice</option></select>' +
              '</div>' +
              '<div class="tr-field"><label for="f-cohort">Cohort</label><select id="f-cohort"></select></div>' +
              '<button class="btn" id="f-go" type="button">Generate code</button>' +
            '</div>' +
            '<div class="tr-err" id="f-err"></div>' +
            '<div class="tr-result" id="f-result">' +
              '<div class="lbl">New access code for <span id="r-name"></span> (<span id="r-role"></span>)</div>' +
              '<div class="code" id="r-code"></div>' +
              '<p class="hint">Share this with them now and have them enter it on the program site. It cannot be recovered later.</p>' +
              '<button class="btn tr-revoke copy" id="r-copy" type="button" style="border-color:var(--line);background:#fff;color:var(--ink)">Copy</button>' +
            '</div>' +
          '</div>' +
          '<div class="tr-card">' +
            '<h2>Existing logins</h2>' +
            '<p class="tr-sub">Forgot a code? <b>Reset code</b> issues a fresh one and disables the old. Codes are one-way — they can\'t be recovered, only reissued.</p>' +
            '<div id="list-msg" class="tr-msg">Loading…</div>' +
            '<table class="tr-list" id="list-tbl" style="display:none"><thead><tr><th>Name</th><th>Role</th><th>Cohort</th><th>Source</th><th></th></tr></thead><tbody id="list-body"></tbody></table>' +
          '</div>' +
        '</div>' +
      '</div>';

    // tab switching
    app.querySelectorAll(".tr-tab").forEach(t => t.addEventListener("click", () => {
      const which = t.getAttribute("data-tab");
      app.querySelectorAll(".tr-tab").forEach(x => x.classList.toggle("on", x === t));
      app.querySelectorAll(".tr-tabpanel").forEach(p => { p.hidden = p.getAttribute("data-panel") !== which; });
    }));
    document.getElementById("f-go").addEventListener("click", addLogin);
    document.getElementById("c-go").addEventListener("click", addCohort);
    document.getElementById("ov-refresh").addEventListener("click", loadOverview);
    document.getElementById("ov-cohort").addEventListener("change", renderOverview);
    document.getElementById("rep-view").addEventListener("click", () => viewReport(document.getElementById("rep-name").value));
    document.getElementById("rep-gen").addEventListener("click", () => genReport(document.getElementById("rep-name").value));
    // Cohorts load first so the add-login + filter selects are populated before use.
    loadCohorts().then(() => { loadList(); loadOverview(); });
  }

  // ---- cohorts ----
  async function loadCohorts() {
    try {
      const r = await fetch(RUN + "/trainer/cohorts", { headers: authHeaders() });
      const data = await r.json();
      if (r.ok && data && data.ok && Array.isArray(data.cohorts)) COHORTS = data.cohorts;
    } catch (e) { /* keep whatever we had — don't clobber optimistic state on a blip */ }
    syncCohortUI();
  }

  // Repaint every cohort-bound control from the current COHORTS array. Kept separate
  // from the fetch so optimistic add/delete can update the UI without a re-list (KV
  // list is eventually consistent — an immediate re-fetch after a write often lags).
  function syncCohortUI() {
    COHORTS.sort((a, b) => String(a.slug).localeCompare(String(b.slug)));
    const fc = document.getElementById("f-cohort");
    if (fc) { const cur = fc.value || ""; fc.innerHTML = cohortOptions(cur, { none: true }); }
    const oc = document.getElementById("ov-cohort");
    if (oc) { const cur = oc.value || "__all"; oc.innerHTML = cohortOptions(cur, { all: true, uat: true }); }
    renderCohortList();
  }

  function renderCohortList() {
    const el = document.getElementById("c-list");
    if (!el) return;
    if (!COHORTS.length) { el.innerHTML = "No cohorts yet — add one above."; return; }
    el.innerHTML = COHORTS.map(c =>
      '<span class="tr-pill role" style="margin:0 8px 8px 0;font-size:13px;padding:5px 10px;display:inline-flex;align-items:center;gap:8px">' +
      esc(c.label || c.slug) +
      '<button class="tr-revoke" data-slug="' + esc(c.slug) + '" style="padding:1px 7px;font-size:12px" title="Remove cohort">✕</button></span>'
    ).join("");
    el.querySelectorAll(".tr-revoke[data-slug]").forEach(b =>
      b.addEventListener("click", () => deleteCohort(b.getAttribute("data-slug"))));
  }

  async function addCohort() {
    const go = document.getElementById("c-go");
    const err = document.getElementById("c-err");
    const inp = document.getElementById("c-num");
    const cohort = inp.value.trim();
    err.textContent = "";
    if (!cohort) { err.textContent = "Enter a cohort number."; return; }
    go.disabled = true;
    try {
      const r = await fetch(RUN + "/trainer/cohort/add", { method: "POST", headers: authHeaders(), body: JSON.stringify({ cohort }) });
      const data = await r.json();
      if (r.ok && data && data.ok) {
        inp.value = "";
        // Optimistically merge the returned record (KV list may not show it yet).
        if (data.cohort && data.cohort.slug && !COHORTS.some(c => c.slug === data.cohort.slug)) COHORTS.push(data.cohort);
        syncCohortUI(); loadList(); loadOverview();
      }
      else if (r.status === 403) err.textContent = "Trainer session required.";
      else err.textContent = "Could not add cohort (" + (data && data.error ? data.error : r.status) + ").";
    } catch (e) { err.textContent = "Network error — is the backend reachable?"; }
    go.disabled = false;
  }

  async function deleteCohort(slug) {
    if (!confirm('Remove cohort "' + slug + '"? Learners tagged with it become UAT until reassigned.')) return;
    try {
      const r = await fetch(RUN + "/trainer/cohort/delete", { method: "POST", headers: authHeaders(), body: JSON.stringify({ cohort: slug }) });
      const data = await r.json();
      if (r.ok && data && data.ok) {
        // Optimistically drop it (KV list may still return it briefly).
        COHORTS = COHORTS.filter(c => c.slug !== slug);
        syncCohortUI(); loadList(); loadOverview();
      }
      else alert("Could not remove cohort (" + (data && data.error ? data.error : r.status) + ").");
    } catch (e) { alert("Network error — is the backend reachable?"); }
  }

  async function setLoginCohort(name, cohort) {
    try {
      const r = await fetch(RUN + "/auth/set-cohort", { method: "POST", headers: authHeaders(), body: JSON.stringify({ name, cohort }) });
      const data = await r.json();
      if (!(r.ok && data && data.ok)) { alert("Could not set cohort (" + (data && data.error ? data.error : r.status) + ")."); loadList(); return; }
      loadOverview(); // reflect the new bucket in the reports table
    } catch (e) { alert("Network error — is the backend reachable?"); }
  }

  function fmtNum(v) { return v == null ? '<span class="ov-na">—</span>' : esc(String(v)); }

  async function loadOverview() {
    const msg = document.getElementById("ov-msg");
    const tbl = document.getElementById("ov-tbl");
    msg.style.display = ""; msg.textContent = "Loading…"; tbl.style.display = "none";
    try {
      const r = await fetch(RUN + "/trainer/overview", { headers: authHeaders() });
      const data = await r.json();
      if (!(r.ok && data && data.ok)) { msg.textContent = r.status === 403 ? "Trainer session required." : "Could not load overview."; return; }
      OV_LEARNERS = data.learners || [];
      renderOverview();
    } catch (e) {
      msg.textContent = "Network error — is the backend reachable?";
    }
  }

  // Cohort pill for the overview table — UAT gets a distinct (warning) style.
  function cohortPill(c) {
    if (c === "UAT") return '<span class="tr-pill notmastered">UAT</span>';
    return '<span class="tr-pill role">' + esc(c) + '</span>';
  }

  // Renders OV_LEARNERS through the current cohort filter + refreshes the report picker.
  function renderOverview() {
    const msg = document.getElementById("ov-msg");
    const tbl = document.getElementById("ov-tbl");
    const body = document.getElementById("ov-body");
    const sel = document.getElementById("rep-name");
    const count = document.getElementById("ov-count");
    const filter = (document.getElementById("ov-cohort") || {}).value || "__all";
    const rows = OV_LEARNERS.filter(l => filter === "__all" || l.cohort === filter);
    if (!OV_LEARNERS.length) { msg.style.display = ""; msg.textContent = "No learners yet."; tbl.style.display = "none"; count.textContent = ""; return; }
    if (!rows.length) { msg.style.display = ""; msg.textContent = "No learners in this cohort."; tbl.style.display = "none"; count.textContent = ""; return; }
    body.innerHTML = rows.map(l => {
      const mastery = l.sdMastered
        ? '<span class="tr-pill mastered">mastered</span>'
        : (l.sdBest != null ? '<span class="tr-pill notmastered">not yet</span>' : '<span class="ov-na">—</span>');
      const weak = (l.weakConcepts && l.weakConcepts.length)
        ? '<span class="ov-weak">' + l.weakConcepts.slice(0, 4).map(esc).join(" · ") + '</span>'
        : '<span class="ov-na">none open</span>';
      const days = l.daysCompleted == null ? '<span class="ov-na" title="Login code not recoverable for this account">n/a</span>' : esc(String(l.daysCompleted));
      // Weekly interview cadence (Feature 1): ✓ done / — not yet this ISO week.
      // Practice identities are never nagged, so show n/a for them.
      const weekly = l.role === "practice"
        ? '<span class="ov-na">—</span>'
        : (l.weeklyInterviewDone
            ? '<span class="tr-pill mastered">✓</span>'
            : '<span class="tr-pill notmastered">due</span>');
      return '<tr><td class="who">' + esc(l.name) + '</td>' +
        '<td>' + cohortPill(l.cohort) + '</td>' +
        '<td><span class="tr-pill role">' + esc(l.role) + '</span></td>' +
        '<td class="num">' + days + '</td>' +
        '<td class="num">' + fmtNum(l.interviewBest) + '</td>' +
        '<td>' + weekly + '</td>' +
        '<td class="num">' + fmtNum(l.collabBest) + '</td>' +
        '<td class="num">' + fmtNum(l.sdBest) + '</td>' +
        '<td>' + mastery + '</td>' +
        '<td>' + weak + '</td></tr>';
    }).join("");
    msg.style.display = "none"; tbl.style.display = "table";
    count.textContent = rows.length + " of " + OV_LEARNERS.length + " shown";
    // Report picker follows the same filter (learners in the shown cohort only).
    const cur = sel.value;
    sel.innerHTML = '<option value="">Select a learner…</option>' +
      rows.map(l => '<option value="' + esc(l.name) + '">' + esc(l.name) + ' (' + esc(l.cohort) + ')</option>').join("");
    if (cur && rows.some(l => l.name === cur)) sel.value = cur;
  }

  function renderReport(rep) {
    const bodyEl = document.getElementById("rep-body");
    if (!rep) { bodyEl.innerHTML = '<p class="rep-empty">No report stored yet for this learner. Click “Generate now”.</p>'; return; }
    const when = rep.generatedAt ? new Date(rep.generatedAt).toLocaleString() : "";
    const list = (arr) => (arr && arr.length) ? '<ul>' + arr.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>' : '<p class="rep-empty">None.</p>';
    bodyEl.innerHTML =
      '<p class="rep-meta">' + esc(rep.name || "") + (rep.cohort ? ' · ' + esc(rep.cohort) : '') + (rep.week ? ' · ' + esc(rep.week) : '') + (when ? ' · generated ' + esc(when) : '') + '</p>' +
      '<div class="rep-sec"><h3>Summary</h3><p>' + esc(rep.summary || "—") + '</p></div>' +
      '<div class="rep-sec"><h3>Progress</h3><p>' + esc(rep.progress || "—") + '</p></div>' +
      '<div class="rep-sec"><h3>Weak points</h3>' + list(rep.weakPoints) + '</div>' +
      '<div class="rep-sec"><h3>Action items</h3>' + list(rep.actionItems) + '</div>';
  }

  async function viewReport(name) {
    const err = document.getElementById("rep-err");
    err.textContent = "";
    if (!name) { err.textContent = "Pick a learner first."; return; }
    document.getElementById("rep-body").innerHTML = '<p class="rep-empty">Loading…</p>';
    try {
      const r = await fetch(RUN + "/trainer/report?name=" + encodeURIComponent(name), { headers: authHeaders() });
      const data = await r.json();
      if (!(r.ok && data && data.ok)) { err.textContent = "Could not load report."; document.getElementById("rep-body").innerHTML = ""; return; }
      renderReport(data.report);
    } catch (e) { err.textContent = "Network error — is the backend reachable?"; }
  }

  async function genReport(name) {
    const err = document.getElementById("rep-err");
    const btn = document.getElementById("rep-gen");
    err.textContent = "";
    if (!name) { err.textContent = "Pick a learner first."; return; }
    btn.disabled = true; const old = btn.textContent; btn.textContent = "Generating…";
    document.getElementById("rep-body").innerHTML = '<p class="rep-empty">Generating report (calls Claude — a few seconds)…</p>';
    try {
      const r = await fetch(RUN + "/trainer/report/generate", { method: "POST", headers: authHeaders(), body: JSON.stringify({ name }) });
      const data = await r.json();
      if (!(r.ok && data && data.ok)) { err.textContent = r.status === 403 ? "Trainer session required." : "Could not generate report."; document.getElementById("rep-body").innerHTML = ""; return; }
      renderReport(data.report);
    } catch (e) { err.textContent = "Network error — is the backend reachable?"; }
    btn.disabled = false; btn.textContent = old;
  }

  async function addLogin() {
    const go = document.getElementById("f-go");
    const err = document.getElementById("f-err");
    const result = document.getElementById("f-result");
    const name = document.getElementById("f-name").value.trim();
    const role = document.getElementById("f-role").value;
    const cohort = document.getElementById("f-cohort").value;
    err.textContent = ""; result.style.display = "none";
    if (!name) { err.textContent = "Enter a name."; return; }
    go.disabled = true;
    try {
      const r = await fetch(RUN + "/auth/add", { method: "POST", headers: authHeaders(), body: JSON.stringify({ name, role, cohort }) });
      const data = await r.json();
      if (r.ok && data && data.ok) {
        document.getElementById("r-name").textContent = data.name;
        document.getElementById("r-role").textContent = data.role;
        document.getElementById("r-code").textContent = data.code;
        result.style.display = "block";
        document.getElementById("f-name").value = "";
        document.getElementById("r-copy").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(data.code); };
        loadList();
      } else if (r.status === 403) {
        err.textContent = "Your session isn't a valid trainer session. Log out and back in with a trainer code.";
      } else {
        err.textContent = "Could not add login (" + (data && data.error ? data.error : r.status) + ").";
      }
    } catch (e) {
      err.textContent = "Network error — is the backend reachable?";
    }
    go.disabled = false;
  }

  async function loadList() {
    const msg = document.getElementById("list-msg");
    const tbl = document.getElementById("list-tbl");
    const body = document.getElementById("list-body");
    try {
      const r = await fetch(RUN + "/auth/list", { headers: authHeaders() });
      const data = await r.json();
      if (!(r.ok && data && data.ok)) { msg.textContent = "Could not load logins."; return; }
      const logins = data.logins || [];
      if (!logins.length) { msg.textContent = "No logins yet."; return; }
      body.innerHTML = logins.map(l => {
        const builtin = l.source === "builtin";
        const reset = builtin ? "" :
          '<button class="tr-reset" data-name="' + esc(l.name) + '" title="Issue a new code, kill the old">Reset code</button>';
        const revoke = builtin
          ? '<button class="tr-revoke" disabled title="Built-in — cannot be revoked here">built-in</button>'
          : '<button class="tr-revoke" data-name="' + esc(l.name) + '">Revoke</button>';
        const cohortCell = builtin
          ? '<span class="ov-na">—</span>'
          : '<select class="tr-cohort" data-name="' + esc(l.name) + '" style="font:inherit;font-size:13px;padding:4px 6px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)">' +
            cohortOptions(knownCohort(l.cohort), { none: true }) + '</select>';
        return '<tr><td class="who">' + esc(l.name) + '</td>' +
          '<td><span class="tr-pill role">' + esc(l.role) + '</span></td>' +
          '<td>' + cohortCell + '</td>' +
          '<td><span class="tr-pill ' + (builtin ? "builtin" : "role") + '">' + esc(l.source) + '</span></td>' +
          '<td style="text-align:right">' + reset + revoke + '</td></tr>';
      }).join("");
      msg.style.display = "none"; tbl.style.display = "table";
      body.querySelectorAll(".tr-revoke[data-name]").forEach(b =>
        b.addEventListener("click", () => revoke(b.getAttribute("data-name"))));
      body.querySelectorAll(".tr-reset[data-name]").forEach(b =>
        b.addEventListener("click", () => resetCode(b.getAttribute("data-name"))));
      body.querySelectorAll(".tr-cohort[data-name]").forEach(s =>
        s.addEventListener("change", () => setLoginCohort(s.getAttribute("data-name"), s.value)));
    } catch (e) {
      msg.textContent = "Network error — is the backend reachable?";
    }
  }

  async function revoke(name) {
    if (!confirm('Revoke ALL logins named "' + name + '"? Their code will stop working immediately.')) return;
    try {
      const r = await fetch(RUN + "/auth/revoke", { method: "POST", headers: authHeaders(), body: JSON.stringify({ name }) });
      const data = await r.json();
      if (r.ok && data && data.ok) loadList();
      else alert("Could not revoke (" + (data && data.error ? data.error : r.status) + ").");
    } catch (e) { alert("Network error — is the backend reachable?"); }
  }

  // Forgot/lost code: issue a fresh one (old stops working). Codes are one-way
  // hashed, so the old code can't be recovered — only reissued.
  async function resetCode(name) {
    if (!confirm('Issue a NEW code for "' + name + '" and disable the old one?\n\nTheir interview / system-design history is kept; reading-progress (tied to the code) resets.')) return;
    try {
      const r = await fetch(RUN + "/auth/reset", { method: "POST", headers: authHeaders(), body: JSON.stringify({ name }) });
      const data = await r.json();
      if (r.ok && data && data.ok) {
        window.prompt("New code for " + name + " — copy + share it now (it won't be shown again):", data.code);
        loadList();
      } else alert("Could not reset (" + (data && data.error ? data.error : r.status) + ").");
    } catch (e) { alert("Network error — is the backend reachable?"); }
  }

  // auth.js gates login + reloads on success; gate on role once identity exists.
  document.addEventListener("DOMContentLoaded", () => {
    const idt = identity();
    if (!idt) return;                       // auth.js is showing the access-code overlay
    if (idt.role !== "trainer") renderDenied();
    else renderApp();
  });
})();
</script>
</body>
</html>
