<noscript><style>#lesson-root{display:none}</style><main class="lesson2 nojs-lesson" data-curriculum-surface><article class="reading-col"><header class="lede"><h1>Kafka foundations and event-driven judgement</h1><div class="meta"><span><b>Week 6</b> · Day 1</span><span><b>Core 30</b> · ~6 min read · 1 interaction · 6-Q check · ~20 min required</span></div><p class="summary">Form the Project 2 banking/payments team, record its one team-primary-cloud ADR, and stand up an inert local Kafka learning environment. Explain when an event stream fits, how records move through topics and partitions, and what evidence proves producer and consumer behavior without confusing a learner&#39;s cloud view with the team&#39;s shared lane.</p><aside class="project-context" aria-label="Project and cloud decision context"><strong>Project 2 · team of 2–3 · regional banking/payments</strong><p>Week 6 is the handover: your team inherits the solo insurance system&#39;s service, RAG, agent, graph, evaluation, and decision evidence for a fictional regional banking/payments engagement. Record one shared team-primary cloud in ADR-P2-001. Your personal AWS, GCP, or Both reading view remains separate and never changes the team&#39;s one implementation lane.</p><a href="../../docs/templates/team-primary-cloud-adr.md">Open the team-primary-cloud ADR template</a></aside></header><section aria-labelledby="nojs-visual-w06d1"><h2 id="nojs-visual-w06d1">Essential event-flow boundary · text alternative</h2><p>A synthetic order producer sends keyed records to a partitioned Kafka topic. A consumer group owns processing, commits progress after completed work, writes a duplicate-safe search outcome, and diverts failures to a retained retry topic with a human replay owner.</p></section><section><h2>Choose events for the right reason</h2><p>Event-driven architecture separates the fact that something happened from the work that follows. A queue usually emphasizes handing work to one processor; publish-subscribe emphasizes independent subscribers; a durable event stream keeps an ordered record that consumers can replay. Kafka is useful when several capabilities need the same facts at different speeds, when replay matters, or when producers must not wait for every downstream system. It adds brokers, schemas, lag, ordering boundaries, and operational ownership, so a direct request or scheduled batch remains the better answer when those properties are unnecessary. Start every design by naming the business event, retention need, replay need, ordering scope, and failure response.</p></section><section><h2>Read topics, partitions, and offsets together</h2><p>A topic is a named stream. Partitions divide that stream into ordered logs and create the unit of parallelism. Kafka orders records within one partition, not across an entire multi-partition topic. An offset is a record&#39;s position inside a partition; a consumer&#39;s committed offset records progress, not a global message ID. A key can route related records to the same partition, preserving their relative order while limiting their processing parallelism to that partition. More partitions can raise throughput and consumer concurrency, but they also increase coordination and can make later partition-count changes affect key distribution. The design question is therefore: which events must be ordered together, and how much parallel work must the system support?</p></section><section><h2>Separate brokers from KRaft control</h2><p>Kafka brokers store partition replicas and serve producer and consumer traffic. The controller quorum manages cluster metadata and leadership. Current Kafka uses KRaft, Kafka&#39;s Raft-based metadata mode, instead of ZooKeeper; the provisionally authoritative curriculum specifically anchors this week on the ZooKeeper-free Kafka 4.x line. That does not make consensus trivia. A learner should be able to distinguish a broker handling data from controllers deciding metadata, explain why replicas exist, and predict that a leader failure triggers leadership movement rather than erasing the log. In the local exercise, controller and broker roles may share containers for convenience, but the diagram keeps the responsibilities separate so a toy topology is never mistaken for a production recommendation.</p></section><section><h2>Make the producer contract explicit</h2><p>A producer serializes a record, selects a topic and usually a key, then sends it under an acknowledgement policy. The key shapes partition choice and therefore ordering. Acknowledgements trade latency against the evidence required before a send is considered successful. Retries can cause duplicate delivery unless producer and downstream behavior are designed for it. Before writing a producer, record the event name, key, schema version, expected volume, acceptable loss or duplication, and what the caller does on timeout. That plan-first artifact reuses the reviewed AI-SDLC discipline in its correct supporting role: it prevents a fast scaffold from creating the wrong event contract. The local sample uses synthetic records only and performs no provider call.</p><details><summary>Required practice: A client needs three independent services to replay the same order events, while preserving order per order ID. Which first design is most defensible?</summary><ul><li>One shared work queue with all services competing for each message</li><li>A partitioned event topic keyed by order ID, with one consumer group per service</li><li>A nightly file export sorted by producer timestamp</li></ul><p><b>Defensible response:</b> A partitioned event topic keyed by order ID, with one consumer group per service</p><p>Independent groups provide fan-out and replay; the order ID key keeps each order&#39;s records in one partition. Global ordering is neither promised nor needed.</p></details></section><section><h2>Treat consumers as coordinated owners</h2><p>Consumers poll partitions and advance their offsets. Consumers sharing a group divide a topic&#39;s partitions among themselves; a partition is assigned to at most one member of that group at a time. Different groups can independently read the same stream for different purposes. This gives a direct capacity rule: adding consumers beyond the partition count does not increase active parallelism for that topic and group. It also gives a failure rule: membership or partition changes cause assignment movement, so handlers must tolerate pauses and redelivery around rebalances. Name the group by workload, not by individual process, and keep offset commits tied to completed work rather than merely received records.</p></section><section><h2>Use a local container as a learning boundary</h2><p>The setup is an inert, local container exercise: one KRaft-based Kafka environment, no cloud account, no public endpoint, no credentials, no Terraform apply, and no real learner or client data. Pin an image version in the trainer-provided sample, expose only loopback ports, and use disposable synthetic events. The objective is to inspect boundaries, not to claim production readiness. A safe plan lists startup, health evidence, topic creation, teardown, and failure cleanup before any command runs. If the supplied image or command differs from the current official quickstart, stop and ask the trainer; do not invent missing client-source facts or silently fetch a different image.</p></section><section><h2>Build CLI literacy from an evidence loop</h2><p>Use the trainer-provided scripts or official command-line tools to inspect the cluster, create or describe a topic, produce a few keyed synthetic events, consume them, and inspect group progress. The command spelling is deliberately secondary. For each action, capture intent, observed evidence, and cleanup: the topic reports the expected partitions; same-key records preserve partition order; a fresh group can replay retained records; the original group resumes from its committed position. End with a short architecture decision: Kafka, a simpler queue, or batch for the stated ask, justified by replay, fan-out, ordering, and operational cost. Commands remain local and reviewable; nothing provisions or publishes.</p></section><details class="deep capstone-optional" data-core="optional"><summary>Optional depth — plan-first setup review · outside Core 30</summary><p>Before running the local sample, review the compose file and scripts as brownfield code: identify ports, persistent volumes, image pins, teardown behavior, and any unexpected network or credential access. Use AI assistance only to summarize and propose tests; a human verifies every command.</p></details><details class="deep capstone-optional" data-core="optional"><summary>Optional depth — CLI worksheet · outside Core 30</summary><p>Record topic, partition count, key, observed partition, consumer group, start offset, end offset, and teardown result. This preserves the old week&#39;s evidence-over-assertion habit without turning Kafka learning into API recall.</p></details><section><h2>Comprehension check</h2><details><summary>1. Which guarantee is native to a Kafka partition?</summary><p><b>Answer:</b> Records in that partition have an ordered offset sequence.</p><p>Kafka&#39;s ordering boundary is the partition, not the whole topic.</p></details><details><summary>2. Why key related events by order ID?</summary><p><b>Answer:</b> To route one order&#39;s events consistently so their relative order can be preserved.</p><p>The key defines the ordering and distribution boundary.</p></details><details><summary>3. What does a committed consumer offset represent?</summary><p><b>Answer:</b> A group&#39;s recorded progress within a specific partition.</p><p>Offsets are partition-local positions used for progress and replay.</p></details><details><summary>4. When do extra consumers stop increasing active parallelism?</summary><p><b>Answer:</b> When the group has more consumers than assigned partitions.</p><p>Only one group member owns a partition at a time.</p></details><details><summary>5. What is KRaft responsible for in this lesson&#39;s model?</summary><p><b>Answer:</b> Kafka metadata and controller consensus, separate from serving record traffic.</p><p>KRaft replaces the ZooKeeper dependency in current Kafka metadata management.</p></details><details><summary>6. What closes the local setup exercise?</summary><p><b>Answer:</b> Evidence of behavior plus explicit local teardown.</p><p>The task is bounded, synthetic, and leaves no standing service.</p></details></section><section class="reading-sources" data-core="optional" aria-label="Sources and evidence"><h2>Sources &amp; evidence trail</h2><ul><li><a href="../../docs/research/w06/w06d1.md">Dated Week 6 Day 1 research record</a></li><li><a href="https://kafka.apache.org/documentation/">Apache Kafka documentation</a></li><li><a href="https://kafka.apache.org/protocol.html">Apache Kafka protocol guide</a></li><li><a href="https://kafka.apache.org/documentation/#operations">Apache Kafka operations</a></li></ul></section><p><a href="../../index.html#curriculum">Return to the curriculum hub</a> · <a href="w06d2.html">Next: Day 2 ▸</a></p></article></main></noscript>
