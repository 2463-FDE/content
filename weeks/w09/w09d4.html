<main id="lesson-root" class="lesson2"><section class="lesson-loading" role="status"><h1>Audit and red-team the delivered system</h1><p>Loading the interactive route. The complete static lesson follows when JavaScript is unavailable.</p></section></main>
<noscript><style>#lesson-root{display:none}</style><main class="lesson2 nojs-lesson"><article class="reading-col"><header class="lede"><h1>Audit and red-team the delivered system</h1><div class="meta"><span><b>Week 9</b> · Day 4</span><span class="core30-meta" data-cloud="aws"><b>Core 30</b> · AWS · ~6 min read · 2 interactions · 6-Q check · ~22 min required</span><span class="core30-meta" data-cloud="gcp"><b>Core 30</b> · GCP · ~6 min read · 2 interactions · 6-Q check · ~22 min required</span></div><p class="summary">Turn hardening into repeatable evidence: automated checks in CI, a provider-neutral control matrix, a bounded audit of Weeks 1–8, and a peer red-team exercise that produces a fix instead of theater.</p></header><section aria-labelledby="static-diagram-w09d4"><h2 id="static-diagram-w09d4">Decision and evidence path · text alternative</h2><p>Follow the seven required decisions in order. Each arrow advances from client consequence and evidence to an owned control, verification result, residual risk, and handoff.</p><details class="diagram-alternative"><summary>Decision diagram · text alternative</summary><ol><li><b>Choose checks that can fail:</b> A security check belongs in CI only when its scope, fixture, threshold, output, and failure behavior are explicit.</li><li><b>Scan without publishing secrets:</b> Use synthetic secret fixtures and redacted findings in learner-visible evidence.</li><li><b>Build the control matrix:</b> Rows are risks and attack paths; columns are prevent, contain, detect, and recover.</li><li><b>Scope the audit to the system arc:</b> Review the learner’s own Weeks 1–8 artifacts: prompts and retrieval, agents and tools, handoffs, observability, security, and client decisions.</li><li><b>Red-team with permission and safe fixtures:</b> The peer exercise uses the agreed scope, synthetic data, a controlled sink, and a stop condition.</li><li><b>Normalize provider comparisons honestly:</b> Use one synthetic prompt/response workload.</li><li><b>Exit with remediation evidence:</b> A finding closes only when the changed control is linked to a test or repeat run.</li></ol></details></section><section><h2>Choose checks that can fail</h2><p>A security check belongs in CI only when its scope, fixture, threshold, output, and failure behavior are explicit. Start with the path identified on Day 1. Avoid a dashboard of warnings that nobody owns and that cannot stop a regression.</p></section><section><h2>Scan without publishing secrets</h2><p>Use synthetic secret fixtures and redacted findings in learner-visible evidence. A scan result should identify file, rule, and remediation without echoing a credential. Real credentials, cloud accounts, and external sends remain outside this curriculum task.</p></section><section><h2>Build the control matrix</h2><p>Rows are risks and attack paths; columns are prevent, contain, detect, and recover. Add the evidence produced by each control and its enforcement layer. Dated provider rows are available for the source-assigned comparison, but they do not settle client applicability: preserve unit, enabled policy, workload assumption, list-price date, owner, and enforcement layer rather than pasting a product name into every column.</p></section><section><h2>Scope the audit to the system arc</h2><p>Review the learner’s own Weeks 1–8 artifacts: prompts and retrieval, agents and tools, handoffs, observability, security, and client decisions. Select one high-consequence path. A full enterprise audit is not credible inside one lesson.</p><div class="capstone-drill" data-core-interaction><div class="ix-k">Required practice · decision and evidence gate</div><p>A peer finds a prompt-injection path in a demo. Which next step makes the exercise delivery work?</p><ol><li>Add the exploit screenshot to the showcase</li><li>Pair on one enforceable control, rerun the scoped test, and link the evidence</li><li>Run broader attacks until the count looks impressive</li></ol><details><summary>Defensible response and evidence receipt</summary><p><b>Answer:</b> Pair on one enforceable control, rerun the scoped test, and link the evidence</p><p>The purpose is remediation evidence. Counts and screenshots do not show that the system boundary changed.</p><p><b>SEC-09-04 audit and red-team report:</b> record Security test owner, the acceptance rule, and the independent review result.</p></details></div></section><section><h2>Red-team with permission and safe fixtures</h2><p>The peer exercise uses the agreed scope, synthetic data, a controlled sink, and a stop condition. Notify the author first. Demonstrate the minimum needed to reproduce the issue, then pair on the control and test.</p></section><section><h2>Normalize provider comparisons honestly</h2><p>Use one synthetic prompt/response workload. Bedrock Guardrails bills each enabled safeguard in rounded 1,000-character text units; Model Armor meters screened prompt/response tokens and can be standalone or included with Security Command Center tiers. Normalize request count, direction, characters, whitespace, enabled controls, included allowance, and subscription assumption. Keep coverage separate: Bedrock Automated Reasoning or contextual grounding and Model Armor injection, sensitive-data, URL, and safety screening are not interchangeable. Every price remains a dated public list input, never a client quote.</p></section><section><h2>Exit with remediation evidence</h2><p>A finding closes only when the changed control is linked to a test or repeat run. Record residual risk, owner, and date for anything deferred. The Thursday milestone is an audit and red-team package that Friday can defend.</p></section><section class="step team-evidence" aria-labelledby="team-evidence-title"><div class="tag">Team delivery evidence</div><h2 id="team-evidence-title">SEC-09-04 audit and red-team report</h2><dl><div><dt>Accountable role</dt><dd>Security test owner</dd></div><div><dt>Acceptance rule</dt><dd>One scoped finding moves from synthetic reproduction to changed control and passing repeat test; provider costs use one normalized workload.</dd></div><div><dt>Independent proof</dt><dd>Peer reviewer signs scope, stop condition, retest identity, and residual-risk owner.</dd></div></dl><p class="team-cloud-note"><b>Two separate decisions:</b> your AWS/GCP/Both reading view is personal. The team’s single Week 6 primary-cloud ADR controls shared implementation evidence.</p></section><section class="provider-paths" aria-labelledby="provider-path-title"><h2 id="provider-path-title">Apply today’s decision on your selected cloud</h2><p>The selected path is primary reading; the other block is comparison depth. Both remains available beyond the one-provider Core 30.</p><details class="cloud-block" data-cloud="aws" open><summary><span class="cloud-tag">AWS</span>AWS-primary · Bedrock Guardrails text-unit model<span class="cloud-role"></span></summary><p>List each enabled safeguard separately, round characters into 1,000-character text units, apply the dated per-safeguard rate, and keep Automated Reasoning policies separate. Record coverage, quality evidence, latency, owner, and application controls outside Guardrails.</p><div class="ix-cloud" data-core-interaction data-cloud="aws"><div class="ix-k">Required provider decision</div><p class="ix-cloud-q">Which estimate is defensible?</p><ol class="ix-cloud-options"><li data-why="This does not enforce the documented boundary.">One universal token price</li><li data-correct data-why="Guardrails meters enabled safeguards separately from model tokens.">Separate dated charges for each enabled safeguard and policy</li><li data-why="This does not enforce the documented boundary.">No charge because model tokens are priced</li></ol><details class="ix-cloud-answer"><summary>Show the answer</summary><p><b>Separate dated charges for each enabled safeguard and policy</b> Guardrails meters enabled safeguards separately from model tokens.</p></details></div></details><details class="cloud-block" data-cloud="gcp" open><summary><span class="cloud-tag">GCP</span>GCP-primary · Model Armor screening and SCC assumption<span class="cloud-role"></span></summary><p>Total screened prompt/response tokens under the documented definition, state standalone or SCC tier, included allowance, overage, coverage, quality evidence, latency, owner, and application controls outside Model Armor.</p><div class="ix-cloud" data-core-interaction data-cloud="gcp"><div class="ix-k">Required provider decision</div><p class="ix-cloud-q">What must accompany a per-million-token row?</p><ol class="ix-cloud-options"><li data-why="This does not enforce the documented boundary.">Only request count</li><li data-correct data-why="Unit, allowance, packaging, workload, and coverage make the row comparable.">Token definition, allowance, packaging, workload, and date</li><li data-why="This does not enforce the documented boundary.">An assumption every control is included</li></ol><details class="ix-cloud-answer"><summary>Show the answer</summary><p><b>Token definition, allowance, packaging, workload, and date</b> Unit, allowance, packaging, workload, and coverage make the row comparable.</p></details></div></details></section><details class="deep capstone-optional" data-core="optional"><summary>Optional depth — full dual-cloud matrix · outside Core 30</summary><p>Add every enabled safeguard, included allowance, rounding rule, subscription assumption, false-positive/false-negative measure, latency, evidence URL, and retrieval date. Keep ordinary authorization and schema validation as separate application controls.</p></details><section class="static-check" aria-labelledby="static-check-title"><h2 id="static-check-title">Comprehension check</h2><details><summary>1. When does a check belong in CI?</summary><p><b>Answer:</b> When scope, fixture, threshold, output, and failure behavior are explicit.</p><p>That makes the gate actionable and repeatable.</p></details><details><summary>2. What data should secret-scanning demos use?</summary><p><b>Answer:</b> Synthetic fixtures and redacted findings.</p><p>The curriculum must not expose real credentials.</p></details><details><summary>3. What are the control-matrix columns?</summary><p><b>Answer:</b> Prevent, contain, detect, recover, plus evidence and enforcement layer.</p><p>The matrix distinguishes control purpose.</p></details><details><summary>4. How broad is today’s audit?</summary><p><b>Answer:</b> One high-consequence path across the Weeks 1–8 system arc.</p><p>Bounded scope can be completed and defended.</p></details><details><summary>5. How is a peer red team run safely?</summary><p><b>Answer:</b> Agreed scope, synthetic data, controlled sink, author notice, and stop condition.</p><p>The exercise must reduce harm.</p></details><details><summary>6. What closes a finding?</summary><p><b>Answer:</b> A changed control linked to a passing test or repeat run.</p><p>Remediation evidence is the exit condition.</p></details></section><section class="reading-sources" data-core="optional" aria-label="Sources and evidence"><h2>Sources &amp; evidence trail</h2><p>Optional references outside the required path. Provider facts are dated; public prices are not client quotes.</p><ul><li><a href="../../docs/research/w09/w09-evidence-index.md">Authoritative W9 transfer record</a></li><li><a href="../../docs/research/w09/archive-week8-security/w08d1.md">Preserved OWASP LLM Top 10 2026 security research</a></li><li><a href="../../docs/research/w09/archive-week8-security/w08d2.md">Preserved prompt-injection architecture research</a></li><li><a href="../../docs/research/w09/archive-week8-security/w08d3.md">Preserved guardrail-framework evidence</a></li><li><a href="../../docs/research/w09/archive-week8-security/w08d4.md">Preserved governance and privacy evidence</a></li><li><a href="../../docs/research/w09/archive-week8-security/w08d5.md">Preserved red-team and deployment-gate evidence</a></li><li><a href="https://aws.amazon.com/bedrock/pricing/" target="_blank" rel="noopener">AWS — Bedrock pricing</a></li><li><a href="https://cloud.google.com/security-command-center/pricing" target="_blank" rel="noopener">Google Cloud — SCC and Model Armor pricing</a></li></ul></section><p><a href="../../index.html#curriculum">Return to the curriculum hub</a></p></article></main></noscript>
