<main id="lesson-root" class="lesson2"><section class="lesson-loading" role="status"><h1>Least privilege across agents, tools, and MCP</h1><p>Loading the interactive route. The complete static lesson follows when JavaScript is unavailable.</p></section></main>
<noscript><style>#lesson-root{display:none}</style><main class="lesson2 nojs-lesson"><article class="reading-col"><header class="lede"><h1>Least privilege across agents, tools, and MCP</h1><div class="meta"><span><b>Week 9</b> · Day 2</span><span class="core30-meta"><b>Core 30</b> · ~3 min read · 1 interaction · 6-Q check · ~17 min required</span></div><p class="summary">Turn yesterday’s threat path into enforceable identity, authorization, data-minimization, and secrets boundaries. The target is not a more obedient model; it is a system where model output cannot grant itself power.</p></header><section aria-labelledby="static-diagram-w09d2"><h2 id="static-diagram-w09d2">Decision and evidence path · text alternative</h2><p>Follow the seven required decisions in order. Each arrow advances from client consequence and evidence to an owned control, verification result, residual risk, and handoff.</p><details class="diagram-alternative"><summary>Decision diagram · text alternative</summary><ol><li><b>Write the capability inventory:</b> For every model-facing tool and MCP server, record the caller identity, allowed operation, resource scope, credential owner, network destination, and approval rule.</li><li><b>Authentication is not authorization:</b> A server can know who called and still allow the wrong action.</li><li><b>Make permissions operation-sized:</b> Split broad tools into narrow operations and use resource constraints the application validates.</li><li><b>Minimize data before the model:</b> Send only fields required for the task.</li><li><b>Keep secrets outside model context:</b> Credentials belong in application-controlled stores and execution environments, never prompts, examples, memory, repositories, or learner-visible configuration.</li><li><b>Use coding-agent controls as defense in depth:</b> Permission modes, hooks, sandboxing, and scoped working directories can narrow what a coding agent attempts.</li><li><b>Prove denial, not only success:</b> The deliverable includes positive and negative tests: the allowed read works; a cross-tenant read, undeclared network call, write with a read credential, and secret-shaped output are refused.</li></ol></details></section><section><h2>Write the capability inventory</h2><p>For every model-facing tool and MCP server, record the caller identity, allowed operation, resource scope, credential owner, network destination, and approval rule. If the inventory says only ‘can call tickets,’ it is not precise enough to review or test.</p></section><section><h2>Authentication is not authorization</h2><p>A server can know who called and still allow the wrong action. Separate connection authentication from per-operation authorization. The current user’s scope must survive agent and tool handoffs; a shared privileged service identity silently expands every learner request.</p></section><section><h2>Make permissions operation-sized</h2><p>Split broad tools into narrow operations and use resource constraints the application validates. Read and write should not share a default permission. Irreversible or externally visible changes require an independent policy check or explicit human approval with the exact action rendered.</p></section><section><h2>Minimize data before the model</h2><p>Send only fields required for the task. Detect and mask sensitive values before they enter prompts, traces, memory, or tool arguments. A downstream output filter cannot retract data already copied to a provider, log, embedding, or retained transcript.</p><div class="capstone-drill" data-core-interaction><div class="ix-k">Required practice · decision and evidence gate</div><p>An MCP-backed ticket tool uses one service token that can read and update every customer. What is the first defensible redesign?</p><ol><li>Hide the token in the system prompt</li><li>Propagate the user and resource scope, split read from update, and enforce both at execution</li><li>Ask the model to confirm customer ownership</li></ol><details><summary>Defensible response and evidence receipt</summary><p><b>Answer:</b> Propagate the user and resource scope, split read from update, and enforce both at execution</p><p>Identity and resource scope must be enforced by the tool or downstream service. Model confirmation is not authorization.</p><p><b>SEC-09-02 capability-and-denial matrix:</b> record Identity/control owner, the acceptance rule, and the independent review result.</p></details></div></section><section><h2>Keep secrets outside model context</h2><p>Credentials belong in application-controlled stores and execution environments, never prompts, examples, memory, repositories, or learner-visible configuration. Logs should identify which credential class was used without revealing the secret itself. Treat tool descriptions and returned text as untrusted content.</p></section><section><h2>Use coding-agent controls as defense in depth</h2><p>Permission modes, hooks, sandboxing, and scoped working directories can narrow what a coding agent attempts. They supplement repository review, tests, and policy enforcement; they do not authorize production changes or replace downstream access controls.</p></section><section><h2>Prove denial, not only success</h2><p>The deliverable includes positive and negative tests: the allowed read works; a cross-tenant read, undeclared network call, write with a read credential, and secret-shaped output are refused. A least-privilege claim without denial evidence is still a design intention.</p></section><section class="step team-evidence" aria-labelledby="team-evidence-title"><div class="tag">Team delivery evidence</div><h2 id="team-evidence-title">SEC-09-02 capability-and-denial matrix</h2><dl><div><dt>Accountable role</dt><dd>Identity/control owner</dd></div><div><dt>Acceptance rule</dt><dd>Every model-facing operation names caller, resource, credential class, destination, approval rule, and at least four denied cases.</dd></div><div><dt>Independent proof</dt><dd>A reviewer reruns allowed-read and forbidden cross-scope/write/secret-output fixtures.</dd></div></dl><p class="team-cloud-note"><b>Two separate decisions:</b> your AWS/GCP/Both reading view is personal. The team’s single Week 6 primary-cloud ADR controls shared implementation evidence.</p></section><details class="deep capstone-optional" data-core="optional"><summary>Optional depth — provider control mapping · outside Core 30</summary><p>The later dual-cloud lane will map verified AWS and GCP controls into these neutral rows. Do not insert certification-objective names or provider-specific claims until that evidence lands.</p></details><section class="static-check" aria-labelledby="static-check-title"><h2 id="static-check-title">Comprehension check</h2><details><summary>1. What must an MCP capability inventory include?</summary><p><b>Answer:</b> Identity, operation, resource, credential, destination, and approval scope.</p><p>Those fields expose privilege and trust boundaries.</p></details><details><summary>2. What must survive a handoff?</summary><p><b>Answer:</b> The original user and authorization scope.</p><p>A shared service identity must not erase caller context.</p></details><details><summary>3. Where should sensitive data be reduced?</summary><p><b>Answer:</b> Before prompts, tools, traces, memory, and external calls.</p><p>Later filtering cannot undo disclosure.</p></details><details><summary>4. Where do credentials belong?</summary><p><b>Answer:</b> Application-controlled secret storage and execution boundaries.</p><p>Model context is not a secret boundary.</p></details><details><summary>5. What are coding-agent permissions?</summary><p><b>Answer:</b> Defense in depth, not authority for production action.</p><p>The task authorizes no real external changes.</p></details><details><summary>6. What evidence proves least privilege?</summary><p><b>Answer:</b> Negative tests showing forbidden actions are denied.</p><p>Success-only tests do not test the boundary.</p></details></section><section class="reading-sources" data-core="optional" aria-label="Sources and evidence"><h2>Sources &amp; evidence trail</h2><p>Optional references outside the required path. Provider facts are dated; public prices are not client quotes.</p><ul><li><a href="../../docs/research/w09/w09-evidence-index.md">Authoritative W9 transfer record</a></li><li><a href="../../docs/research/w09/archive-week8-security/w08d1.md">Preserved OWASP LLM Top 10 2026 security research</a></li><li><a href="../../docs/research/w09/archive-week8-security/w08d2.md">Preserved prompt-injection architecture research</a></li><li><a href="../../docs/research/w09/archive-week8-security/w08d3.md">Preserved guardrail-framework evidence</a></li><li><a href="../../docs/research/w09/archive-week8-security/w08d4.md">Preserved governance and privacy evidence</a></li><li><a href="../../docs/research/w09/archive-week8-security/w08d5.md">Preserved red-team and deployment-gate evidence</a></li></ul></section><p><a href="../../index.html#curriculum">Return to the curriculum hub</a></p></article></main></noscript>
