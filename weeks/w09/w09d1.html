<main id="lesson-root" class="lesson2"><section class="lesson-loading" role="status"><h1>Threat-model the system you actually built</h1><p>Loading the interactive route. The complete static lesson follows when JavaScript is unavailable.</p></section></main>
<noscript><style>#lesson-root{display:none}</style><main class="lesson2 nojs-lesson"><article class="reading-col"><header class="lede"><h1>Threat-model the system you actually built</h1><div class="meta"><span><b>Week 9</b> · Day 1</span><span class="core30-meta"><b>Core 30</b> · ~5 min read · 1 interaction · 6-Q check · ~19 min required</span></div><p class="summary">Week 8 made the inherited system operable; Week 9 applies preserved security research to harden it. Build one threat model from real data flows, agent capabilities, memory, tools, and telemetry boundaries; then choose the first hardening decision from evidence rather than from a generic checklist.</p></header><section aria-labelledby="static-diagram-w09d1"><h2 id="static-diagram-w09d1">Decision and evidence path · text alternative</h2><p>Follow the seven required decisions in order. Each arrow advances from client consequence and evidence to an owned control, verification result, residual risk, and handoff.</p><details class="diagram-alternative"><summary>Decision diagram · text alternative</summary><ol><li><b>Start from the delivered system:</b> A threat model begins with the system on main, not an ideal architecture.</li><li><b>Name assets and consequences:</b> List what the client would lose: confidential data, correct decisions, service availability, audit evidence, and stakeholder trust.</li><li><b>Trace attacker-controlled input:</b> Follow direct user text, retrieved records, tool responses, issue content, uploaded files, and persistent memory.</li><li><b>Map capability and privilege:</b> For each tool, record read, write, external communication, credential, and approval scope.</li><li><b>Separate prevention from containment:</b> Classifiers, filters, and input rules can reduce attack volume.</li><li><b>Choose one hardening slice:</b> The day ends with one bounded decision: remove a capability, narrow a permission, gate a sink, or isolate a context.</li><li><b>Prepare the security readout:</b> State the client asset, attack path, removed capability, and residual risk in four sentences.</li></ol></details></section><section><h2>Start from the delivered system</h2><p>A threat model begins with the system on main, not an ideal architecture. Mark the user entry points, retrieved content, memories, model calls, tools, and outbound sinks. Reuse the diagrams and findings from Weeks 2–8 so every boundary has an artifact behind it. Anything not observed is an assumption and belongs in a separate column.</p></section><section><h2>Name assets and consequences</h2><p>List what the client would lose: confidential data, correct decisions, service availability, audit evidence, and stakeholder trust. Connect each asset to a concrete client consequence. This keeps a technical finding from becoming an isolated severity score and gives the Friday readout a reason the client can act on.</p></section><section><h2>Trace attacker-controlled input</h2><p>Follow direct user text, retrieved records, tool responses, issue content, uploaded files, and persistent memory. Preserved security research establishes that instructions and data can share one model context; Week 8 adds telemetry and incident boundaries. The hardening move is to identify where untrusted content enters and which later capability could turn it into an action.</p></section><section><h2>Map capability and privilege</h2><p>For each tool, record read, write, external communication, credential, and approval scope. A tool name is not a permission boundary. The application or downstream service must enforce the decision. Highlight any session that combines private data, untrusted content, and external communication.</p><div class="capstone-drill" data-core-interaction><div class="ix-k">Required practice · decision and evidence gate</div><p>The agent reads customer-uploaded documents, can query private case data, and can render model-supplied external links. Which first change most directly removes the high-impact combination?</p><ol><li>Add a stronger system prompt</li><li>Block or require approval for external link rendering after untrusted content enters context</li><li>Increase the model context window</li></ol><details><summary>Defensible response and evidence receipt</summary><p><b>Answer:</b> Block or require approval for external link rendering after untrusted content enters context</p><p>Gate the sink. It removes the external-communication leg with an enforceable application control; prompt wording does not create that boundary.</p><p><b>SEC-09-01 threat-path record:</b> record Security owner, the acceptance rule, and the independent review result.</p></details></div></section><section><h2>Separate prevention from containment</h2><p>Classifiers, filters, and input rules can reduce attack volume. They do not replace least privilege, deterministic mediation, sink controls, bounded memory, or human approval for irreversible actions. Put each proposed control in a prevent, contain, detect, or recover column so the architecture does not overclaim what a filter guarantees.</p></section><section><h2>Choose one hardening slice</h2><p>The day ends with one bounded decision: remove a capability, narrow a permission, gate a sink, or isolate a context. Record the owner, affected path, evidence, and verification method. Do not open five security workstreams because the list contains five threat names.</p></section><section><h2>Prepare the security readout</h2><p>State the client asset, attack path, removed capability, and residual risk in four sentences. Show the changed boundary on the diagram. The Week 9 milestone begins when another engineer can reproduce the threat path and verify the control without relying on the author’s explanation.</p></section><section class="step team-evidence" aria-labelledby="team-evidence-title"><div class="tag">Team delivery evidence</div><h2 id="team-evidence-title">SEC-09-01 threat-path record</h2><dl><div><dt>Accountable role</dt><dd>Security owner</dd></div><div><dt>Acceptance rule</dt><dd>One inherited banking/payments path links asset, untrusted source, capability, sink, changed boundary, negative test, and residual risk.</dd></div><div><dt>Independent proof</dt><dd>A teammate reproduces the synthetic path and denial from the artifact.</dd></div></dl><p class="team-cloud-note"><b>Two separate decisions:</b> your AWS/GCP/Both reading view is personal. The team’s single Week 6 primary-cloud ADR controls shared implementation evidence.</p></section><details class="deep capstone-optional" data-core="optional"><summary>Optional depth — revisit the preserved threat taxonomy · outside Core 30</summary><p>Open the archived security sources and attach current risk IDs only where they improve traceability. A framework label is evidence routing, not proof that a control works.</p></details><section class="static-check" aria-labelledby="static-check-title"><h2 id="static-check-title">Comprehension check</h2><details><summary>1. What is the authoritative starting point for the threat model?</summary><p><b>Answer:</b> The system and artifacts currently delivered on main.</p><p>The exercise models the real brownfield system, with assumptions labeled.</p></details><details><summary>2. What makes a tool boundary enforceable?</summary><p><b>Answer:</b> Application or downstream authorization independent of model judgement.</p><p>A model choosing a tool is not authorization.</p></details><details><summary>3. How should filters be represented?</summary><p><b>Answer:</b> As risk-reduction controls, separate from containment boundaries.</p><p>This avoids promising prevention where only detection exists.</p></details><details><summary>4. What should each threat connect to?</summary><p><b>Answer:</b> A client asset and consequence.</p><p>The client decides from consequence, not taxonomy alone.</p></details><details><summary>5. What is the day’s implementation scope?</summary><p><b>Answer:</b> One bounded hardening decision with owner and verification.</p><p>Narrow scope is what makes the control demonstrable.</p></details><details><summary>6. What closes the day?</summary><p><b>Answer:</b> A reproducible threat path and a changed boundary another engineer can verify.</p><p>Reproducibility converts a concern into delivery evidence.</p></details></section><section class="reading-sources" data-core="optional" aria-label="Sources and evidence"><h2>Sources &amp; evidence trail</h2><p>Optional references outside the required path. Provider facts are dated; public prices are not client quotes.</p><ul><li><a href="../../docs/research/w09/w09-evidence-index.md">Authoritative W9 transfer record</a></li><li><a href="../../docs/research/w09/archive-week8-security/w08d1.md">Preserved OWASP LLM Top 10 2026 security research</a></li><li><a href="../../docs/research/w09/archive-week8-security/w08d2.md">Preserved prompt-injection architecture research</a></li><li><a href="../../docs/research/w09/archive-week8-security/w08d3.md">Preserved guardrail-framework evidence</a></li><li><a href="../../docs/research/w09/archive-week8-security/w08d4.md">Preserved governance and privacy evidence</a></li><li><a href="../../docs/research/w09/archive-week8-security/w08d5.md">Preserved red-team and deployment-gate evidence</a></li></ul></section><p><a href="../../index.html#curriculum">Return to the curriculum hub</a></p></article></main></noscript>
