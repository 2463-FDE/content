<main id="lesson-root" class="lesson2"><section class="lesson-loading" role="status"><h1>Verify rollback and build the handoff package</h1><p>Loading the interactive route. The complete static lesson follows when JavaScript is unavailable.</p></section></main>
<noscript><style>#lesson-root{display:none}</style><main class="lesson2 nojs-lesson"><article class="reading-col"><header class="lede"><h1>Verify rollback and build the handoff package</h1><div class="meta"><span><b>Week 10</b> · Day 3</span><span class="core30-meta"><b>Core 30</b> · ~2 min read · 1 interaction · 6-Q check · ~16 min required</span></div><p class="summary">Prove the system can be verified, observed, and recovered by someone else. Run smoke and failure drills locally, curate operating views, and assemble docs, runbooks, decisions, environment facts, and access responsibilities.</p></header><section aria-labelledby="static-diagram-w10d3"><h2 id="static-diagram-w10d3">Decision and evidence path · text alternative</h2><p>Follow the seven required decisions in order. Each arrow advances from client consequence and evidence to an owned control, verification result, residual risk, and handoff.</p><details class="diagram-alternative"><summary>Decision diagram · text alternative</summary><ol><li><b>Define verification after cutover:</b> List the smallest checks that prove the release is serving the intended users, processing the intended data, and producing the intended client outcome.</li><li><b>Prove rollback readiness:</b> A rollback plan names the previous candidate, data compatibility, command or procedure, owner, trigger, verification, and time expectation.</li><li><b>Run a failure drill:</b> Choose one realistic failure from the risk register.</li><li><b>Write a runbook that runs:</b> Use prerequisites, symptoms, checks, exact local or simulated actions, expected results, escalation, and recovery verification.</li><li><b>Curate the operating view:</b> Select the few dashboards or reports that answer: is it working, is the client outcome moving, and who acts when it is not? Link each to an owner and response path.</li><li><b>Document environment and access:</b> Record required environments, configuration classes, identity owners, approval paths, and credential rotation responsibilities without publishing secrets.</li><li><b>Prepare knowledge transfer:</b> Build a short session around one normal operation, one failure, one decision history, and one open risk.</li></ol></details></section><section><h2>Define verification after cutover</h2><p>List the smallest checks that prove the release is serving the intended users, processing the intended data, and producing the intended client outcome. Keep these distinct from the full regression suite so operators can run them quickly.</p></section><section><h2>Prove rollback readiness</h2><p>A rollback plan names the previous candidate, data compatibility, command or procedure, owner, trigger, verification, and time expectation. Rehearse the decision and local procedure; do not touch real infrastructure.</p></section><section><h2>Run a failure drill</h2><p>Choose one realistic failure from the risk register. Observe the signal, follow the runbook, contain impact, recover, and note what was ambiguous. The drill tests the operating system around the software as much as the code.</p></section><section><h2>Write a runbook that runs</h2><p>Use prerequisites, symptoms, checks, exact local or simulated actions, expected results, escalation, and recovery verification. Remove steps that depend on the original author’s memory or access.</p><div class="capstone-drill" data-core-interaction><div class="ix-k">Required practice · decision and evidence gate</div><p>A rollback document says ‘redeploy the previous version’ but does not identify it or address data compatibility. What should happen?</p><ol><li>Accept it as a high-level runbook</li><li>Block readiness until the candidate and compatibility check are explicit</li><li>Ask the model to select the prior version during an incident</li></ol><details><summary>Defensible response and evidence receipt</summary><p><b>Answer:</b> Block readiness until the candidate and compatibility check are explicit</p><p>Rollback is an executable decision path. Ambiguous versions and data state make it unsafe.</p><p><b>OPS-10-03 operator handoff package:</b> record Operations owner, the acceptance rule, and the independent review result.</p></details></div></section><section><h2>Curate the operating view</h2><p>Select the few dashboards or reports that answer: is it working, is the client outcome moving, and who acts when it is not? Link each to an owner and response path. More panels do not equal more readiness.</p></section><section><h2>Document environment and access</h2><p>Record required environments, configuration classes, identity owners, approval paths, and credential rotation responsibilities without publishing secrets. Mark unavailable external accounts as prerequisites, not as completed setup.</p></section><section><h2>Prepare knowledge transfer</h2><p>Build a short session around one normal operation, one failure, one decision history, and one open risk. The receiver performs the task while the author observes. Questions become handoff defects or documented follow-ups.</p></section><section class="step team-evidence" aria-labelledby="team-evidence-title"><div class="tag">Team delivery evidence</div><h2 id="team-evidence-title">OPS-10-03 operator handoff package</h2><dl><div><dt>Accountable role</dt><dd>Operations owner</dd></div><div><dt>Acceptance rule</dt><dd>Smoke, failure, rollback, dashboard, access-responsibility, ADR, and runbook paths are findable with no credential values.</dd></div><div><dt>Independent proof</dt><dd>A non-author performs the local smoke/rollback rehearsal in ten minutes.</dd></div></dl><p class="team-cloud-note"><b>Two separate decisions:</b> your AWS/GCP/Both reading view is personal. The team’s single Week 6 primary-cloud ADR controls shared implementation evidence.</p></section><details class="deep capstone-optional" data-core="optional"><summary>Optional depth — handoff completeness review · outside Core 30</summary><p>Ask a reviewer unfamiliar with the project to locate the current candidate, start path, smoke test, rollback trigger, on-call owner, and decision index. Time the search; fix missing routes.</p></details><section class="static-check" aria-labelledby="static-check-title"><h2 id="static-check-title">Comprehension check</h2><details><summary>1. How do smoke tests differ from regressions?</summary><p><b>Answer:</b> They are the smallest fast checks proving service and outcome after change.</p><p>Operators need a rapid verification path.</p></details><details><summary>2. What identifies rollback?</summary><p><b>Answer:</b> Previous candidate, trigger, procedure, compatibility, owner, and verification.</p><p>‘Go back’ is not executable.</p></details><details><summary>3. What does a failure drill test?</summary><p><b>Answer:</b> Signals, runbook, containment, recovery, and operating ambiguity.</p><p>It tests the whole operating system.</p></details><details><summary>4. What should a runbook remove?</summary><p><b>Answer:</b> Dependence on the original author’s memory or access.</p><p>Handoff must survive team change.</p></details><details><summary>5. How are dashboards selected?</summary><p><b>Answer:</b> By service health, client outcome, and response ownership.</p><p>Panel volume is not readiness.</p></details><details><summary>6. How are secrets handled in access docs?</summary><p><b>Answer:</b> Responsibilities and classes are documented; secret values are not.</p><p>The handoff must not create a new leak.</p></details></section><section class="reading-sources" data-core="optional" aria-label="Sources and evidence"><h2>Sources &amp; evidence trail</h2><p>Optional references outside the required path. Provider facts are dated; public prices are not client quotes.</p><ul><li><a href="../../docs/research/w10/w10-evidence-index.md">Authoritative W10 transfer record</a></li><li><a href="../../docs/week-fanout-plan.md">Core-30 authoring contract</a></li><li><a href="../../client-delivery.html?w=10">Client-delivery packets and handoff expectations</a></li></ul></section><p><a href="../../index.html#curriculum">Return to the curriculum hub</a></p></article></main></noscript>
