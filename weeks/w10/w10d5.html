<main id="lesson-root" class="lesson2"><section class="lesson-loading" role="status"><h1>Client showcase and final handoff</h1><p>Loading the interactive route. The complete static lesson follows when JavaScript is unavailable.</p></section></main>
<noscript><style>#lesson-root{display:none}</style><main class="lesson2 nojs-lesson"><article class="reading-col"><header class="lede"><h1>Client showcase and final handoff</h1><div class="meta"><span><b>Week 10</b> · Day 5</span><span class="core30-meta" data-cloud="aws"><b>Core 30</b> · AWS · ~5 min read · 2 interactions · 6-Q check · ~21 min required</span><span class="core30-meta" data-cloud="gcp"><b>Core 30</b> · GCP · ~5 min read · 2 interactions · 6-Q check · ~21 min required</span></div><p class="summary">Deliver the capstone executive readout, defend the system with the technical team, hand off the evidence and operating package, and close the engagement honestly. The showcase uses simulated/local artifacts only; merge, deployment, and publication remain separate decisions.</p></header><section aria-labelledby="static-diagram-w10d5"><h2 id="static-diagram-w10d5">Decision and evidence path · text alternative</h2><p>Follow the seven required decisions in order. Each arrow advances from client consequence and evidence to an owned control, verification result, residual risk, and handoff.</p><details class="diagram-alternative"><summary>Decision diagram · text alternative</summary><ol><li><b>Open with the outcome:</b> State what changed for the client, the before and after evidence, and the decision the room needs to make.</li><li><b>Walk the engagement arc:</b> Connect Weeks 1–5 solo discovery and build work to the Weeks 6–10 team engagement that inherited it.</li><li><b>Demonstrate the system:</b> Use a representative interaction and essential diagram to show one high-value path.</li><li><b>Defend the architecture:</b> Explain boundaries, tradeoffs, least privilege, observability, security controls, and rollback.</li><li><b>Defend workload placement carefully:</b> Present the dated provider evidence from Monday, portability, lock-in surfaces, normal egress, migration effort, and conditions that would flip the recommendation.</li><li><b>Complete sign-off and handoff:</b> Give the client the candidate reference, README, runbook, ADR index, evidence bundle, open-risk register, roadmap, owner list, and knowledge-transfer record.</li><li><b>Close the program:</b> Export the personal engineering toolkit as reviewed configuration and practices, excluding credentials and client secrets.</li></ol></details></section><section><h2>Open with the outcome</h2><p>State what changed for the client, the before and after evidence, and the decision the room needs to make. Name the scope and the evidence date. Do not imply production deployment, real cloud resources, or external sends where none exist.</p></section><section><h2>Walk the engagement arc</h2><p>Connect Weeks 1–5 solo discovery and build work to the Weeks 6–10 team engagement that inherited it. Show how decisions, tests, risks, and client artifacts survived the handover rather than resetting at Week 6.</p></section><section><h2>Demonstrate the system</h2><p>Use a representative interaction and essential diagram to show one high-value path. The demo script names the data, expected result, failure signal, and recovery sentence. Keep synthetic fixtures visibly labeled.</p></section><section><h2>Defend the architecture</h2><p>Explain boundaries, tradeoffs, least privilege, observability, security controls, and rollback. Answer what would change under different scale, risk, or provider assumptions. Point to decisions and tests rather than claiming certainty.</p><div class="capstone-drill" data-core-interaction><div class="ix-k">Required practice · decision and evidence gate</div><p>A showcase slide claims migration egress is free, but the team has not checked eligibility, approval, termination, data volume, or non-network migration work. What should the presenter do?</p><ol><li>Keep the claim because both vendors advertise relief</li><li>Show dated terms as a conditional input, cost the remaining work, and keep the gap and flip condition visible</li><li>Remove all workload-placement discussion</li></ol><details><summary>Defensible response and evidence receipt</summary><p><b>Answer:</b> Show dated terms as a conditional input, cost the remaining work, and keep the gap and flip condition visible</p><p>A conditional data-transfer waiver is not a zero-cost migration. The evidence, assumptions, remaining work, and recommendation boundary must stay visible.</p><p><b>HANDOFF-10-05 final evidence index:</b> record Handoff owner, the acceptance rule, and the independent review result.</p></details></div></section><section><h2>Defend workload placement carefully</h2><p>Present the dated provider evidence from Monday, portability, lock-in surfaces, normal egress, migration effort, and conditions that would flip the recommendation. Both providers publish migration-related data-transfer relief subject to eligibility, request, approval, and termination conditions; neither makes ordinary operating egress or the rest of migration free. Unknown client volume, region, contract, and discount cells remain visible. Defend the method and bounded recommendation without pretending public list inputs are client facts.</p></section><section><h2>Complete sign-off and handoff</h2><p>Give the client the candidate reference, README, runbook, ADR index, evidence bundle, open-risk register, roadmap, owner list, and knowledge-transfer record. Sign-off states what was reviewed and what remains outside scope.</p></section><section><h2>Close the program</h2><p>Export the personal engineering toolkit as reviewed configuration and practices, excluding credentials and client secrets. Run the retrospective: keep, change, stop. The trainer records follow-ups separately; no deployment, publication, or merge occurs without the captain’s explicit later decision.</p></section><section class="step team-evidence" aria-labelledby="team-evidence-title"><div class="tag">Team delivery evidence</div><h2 id="team-evidence-title">HANDOFF-10-05 final evidence index</h2><dl><div><dt>Accountable role</dt><dd>Handoff owner</dd></div><div><dt>Acceptance rule</dt><dd>Candidate, ADRs, runbooks, risks, owners, KT result, placement defense, exclusions, and sign-off scope are linked and frozen.</dd></div><div><dt>Independent proof</dt><dd>Receiver completes one normal and one failure path; unresolved questions become dated defects.</dd></div></dl><p class="team-cloud-note"><b>Two separate decisions:</b> your AWS/GCP/Both reading view is personal. The team’s single Week 6 primary-cloud ADR controls shared implementation evidence.</p></section><section class="provider-paths" aria-labelledby="provider-path-title"><h2 id="provider-path-title">Apply today’s decision on your selected cloud</h2><p>The selected path is primary reading; the other block is comparison depth. Both remains available beyond the one-provider Core 30.</p><details class="cloud-block" data-cloud="aws" open><summary><span class="cloud-tag">AWS</span>AWS-primary · placement and exit defense<span class="cloud-role"></span></summary><p>Defend the memo, then inventory portable artifacts, AWS-native dependencies, ordinary egress, export work, dual run, validation, and residual copies. Migration transfer relief is conditional; verify eligibility and approval.</p><div class="ix-cloud" data-core-interaction data-cloud="aws"><div class="ix-k">Required provider decision</div><p class="ix-cloud-q">What does transfer relief prove?</p><ol class="ix-cloud-options"><li data-why="This does not enforce the documented boundary.">All migration cost is zero</li><li data-correct data-why="Service, labor, conversion, dual-run, and validation cost remain.">One network term may be waived when conditions are met</li><li data-why="This does not enforce the documented boundary.">The ADR can never change</li></ol><details class="ix-cloud-answer"><summary>Show the answer</summary><p><b>One network term may be waived when conditions are met</b> Service, labor, conversion, dual-run, and validation cost remain.</p></details></div></details><details class="cloud-block" data-cloud="gcp" open><summary><span class="cloud-tag">GCP</span>GCP-primary · placement and exit defense<span class="cloud-role"></span></summary><p>Defend the memo, then inventory portable artifacts, Google-native dependencies, ordinary egress, export work, dual run, validation, and residual copies. Migration transfer relief is conditional on the documented process.</p><div class="ix-cloud" data-core-interaction data-cloud="gcp"><div class="ix-k">Required provider decision</div><p class="ix-cloud-q">What belongs beside a waiver assumption?</p><ol class="ix-cloud-options"><li data-why="This does not enforce the documented boundary.">Every export is free</li><li data-correct data-why="A conditional waiver is one assumption in a larger exit plan.">Eligibility, approval, timing, termination, work, owner, and fallback</li><li data-why="This does not enforce the documented boundary.">Only data volume</li></ol><details class="ix-cloud-answer"><summary>Show the answer</summary><p><b>Eligibility, approval, timing, termination, work, owner, and fallback</b> A conditional waiver is one assumption in a larger exit plan.</p></details></div></details></section><details class="deep capstone-optional" data-core="optional"><summary>Optional depth — exit-cost stress test · outside Core 30</summary><p>Inventory export format, data volume, transfer path, ordinary egress, waiver eligibility/approval assumptions, service termination, dual run, conversion, downtime, residual copies, owner, and recovery proof. A network-fee waiver removes only one term.</p></details><section class="static-check" aria-labelledby="static-check-title"><h2 id="static-check-title">Comprehension check</h2><details><summary>1. What must the opening avoid implying?</summary><p><b>Answer:</b> Real deployment, resources, sends, or publication that did not occur.</p><p>The showcase must preserve scope truth.</p></details><details><summary>2. What proves the two-project arc?</summary><p><b>Answer:</b> Decisions, tests, risks, and artifacts survive the Week 6 handover.</p><p>Inheritance distinguishes the arc from two unrelated projects.</p></details><details><summary>3. What does the representative demo name?</summary><p><b>Answer:</b> Data, expected result, failure signal, and recovery sentence.</p><p>A script makes the demonstration reproducible.</p></details><details><summary>4. How is architecture defended?</summary><p><b>Answer:</b> With boundaries, tradeoffs, tests, decisions, and changed-assumption analysis.</p><p>Confidence comes from evidence, not absolutes.</p></details><details><summary>5. How are dated provider facts used?</summary><p><b>Answer:</b> As bounded inputs combined with client assumptions, confidence, and flip conditions.</p><p>Public evidence supports a defense but does not invent a client contract or predetermined winner.</p></details><details><summary>6. What does final sign-off state?</summary><p><b>Answer:</b> Reviewed scope, delivered package, residual risks, owners, and exclusions.</p><p>Sign-off is bounded, not a claim of completeness everywhere.</p></details></section><section class="reading-sources" data-core="optional" aria-label="Sources and evidence"><h2>Sources &amp; evidence trail</h2><p>Optional references outside the required path. Provider facts are dated; public prices are not client quotes.</p><ul><li><a href="../../docs/research/w10/w10-evidence-index.md">Authoritative W10 transfer record</a></li><li><a href="../../docs/week-fanout-plan.md">Core-30 authoring contract</a></li><li><a href="../../client-delivery.html?w=10">Client-delivery packets and handoff expectations</a></li><li><a href="https://aws.amazon.com/blogs/aws/free-data-transfer-out-to-internet-when-moving-out-of-aws/" target="_blank" rel="noopener">AWS — Transfer when moving out</a></li><li><a href="https://cloud.google.com/blog/products/networking/eliminating-data-transfer-fees-when-migrating-off-google-cloud" target="_blank" rel="noopener">Google Cloud — Transfer when migrating off</a></li></ul></section><p><a href="../../index.html#curriculum">Return to the curriculum hub</a></p></article></main></noscript>
