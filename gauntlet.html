<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Interview — Interview &amp; System Design · 2463-FDE</title>
  <meta name="description" content="Speak your answers. Design real systems. AI critics score them." />

  <!-- Excalidraw diagram canvas (System Design Simulator). React + ReactDOM +
       the Excalidraw UMD bundle from CDN — no build step. EXCALIDRAW_ASSET_PATH
       must be set BEFORE the bundle so fonts/assets resolve. -->
  <script>window.EXCALIDRAW_ASSET_PATH = "https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/";</script>
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw.production.min.js"></script>

  <link rel="stylesheet" href="assets/gauntlet/css/site.css?v=20260630-1" />
  <script src="assets/js/theme.js"></script>
</head>
<body>
  <header id="appHeader" class="app-header"></header>
  <main id="app" class="app-main"></main>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Shared 2463 identity: roster.js + auth.js write localStorage["fde_identity"]
       = {code,name,role}. The gauntlet reads that and uses `code` as its passcode,
       so entering from the program site needs no second login. -->
  <script src="assets/js/roster.js"></script>
  <script src="assets/js/auth.js"></script>

  <!-- config first, then helpers, then features. Bump ?v= on every change. -->
  <script src="assets/gauntlet/config.js?v=20260629-4"></script>
  <script src="assets/gauntlet/js/api.js?v=20260629-4"></script>
  <script src="assets/gauntlet/js/stt.js?v=20260629-4"></script>
  <script src="assets/gauntlet/js/design.js?v=20260629-4"></script>
  <script src="assets/gauntlet/js/trainer.js?v=20260629-4"></script>
  <script src="assets/gauntlet/js/app.js?v=20260629-4"></script>
</body>
</html>
